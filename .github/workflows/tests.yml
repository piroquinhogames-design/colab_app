name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install flask requests pillow pycryptodome tenacity packaging websocket-client pydantic pydantic-settings
      - run: pip install --no-deps mega.py==1.0.8
      - run: python contract_check.py
        env:
          STUDIO_START_WORKERS: '0'
      - run: npm ci
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
